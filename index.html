<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Details</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #333; margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h1 { text-align: center; color: #4CAF50; margin-bottom: 20px; }
        form { display: flex; flex-direction: column; }
        label { margin-top: 15px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { margin-top: 25px; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enter Product Details</h1>
        <form action="qr.html" method="get">
        <label for="genericName">Generic Name:</label>
        <input type="text" id="genericName" name="genericName" value="Glimepiride & Metformin Hydrochloride (SR) Tablets" required>

        <label for="brandName">Brand Name:</label>
        <input type="text" id="brandName" name="brandName" value="Hexaglim-M1" required>

        <label for="batchNo">Batch No:</label>
        <input type="text" id="batchNo" name="batchNo" value="HEHT2502" required>

        <label for="mfgDate">Mfg.Date:</label>
        <input type="text" id="mfgDate" name="mfgDate" value="SEP.2025" required>

        <label for="expDate">EXP.Date:</label>
        <input type="text" id="expDate" name="expDate" value="AUG.2028" required>

        <label for="mrp">MRP Rs:</label>
        <input type="text" id="mrp" name="mrp" value="112.50" required>

        <label for="manufacturedBy">Manufactured By:</label>
        <input type="text" id="manufacturedBy" name="manufacturedBy" value="Goodman Pharmaceuticals" required>

        <label for="marketedBy">Marketed by:</label>
        <input type="text" id="marketedBy" name="marketedBy" value="Hicxica Formulation Pvt. Ltd." required>

        <button type="submit">Generate QR Code</button>
        </form>
    </div>
</body>
</html>
