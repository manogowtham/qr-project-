<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: #333; margin: 0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 600px; width: 100%; text-align: center; }
        h1 { color: #f5576c; margin-bottom: 20px; }
        #qrcode { margin: 20px auto; }
        .buttons { display: flex; gap: 10px; justify-content: center; }
        button { margin-top: 20px; padding: 10px 20px; background-color: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Generated QR Code</h1>
        <div id="qrcode"></div>
        <div class="buttons">
            <button id="backBtn">Back</button>
            <button id="viewDetails">View Details</button>
            <button id="downloadQR">Download QR</button>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const genericName = urlParams.get('genericName');
        const brandName = urlParams.get('brandName');
        const batchNo = urlParams.get('batchNo');
        const mfgDate = urlParams.get('mfgDate');
        const expDate = urlParams.get('expDate');
        const mrp = urlParams.get('mrp');
        const manufacturedBy = urlParams.get('manufacturedBy');
        const marketedBy = urlParams.get('marketedBy');

        let displayUrl = '';
        if (genericName) {
            displayUrl = `${window.location.origin}/display.html?genericName=${encodeURIComponent(genericName)}&brandName=${encodeURIComponent(brandName)}&batchNo=${encodeURIComponent(batchNo)}&mfgDate=${encodeURIComponent(mfgDate)}&expDate=${encodeURIComponent(expDate)}&mrp=${encodeURIComponent(mrp)}&manufacturedBy=${encodeURIComponent(manufacturedBy)}&marketedBy=${encodeURIComponent(marketedBy)}`;
            new QRCode(document.getElementById("qrcode"), displayUrl);
        } else {
            document.getElementById("qrcode").innerHTML = "<p>No data provided.</p>";
        }

        document.getElementById('viewDetails').addEventListener('click', function() {
            if (displayUrl) {
                window.open(displayUrl, '_blank');
            }
        });

        document.getElementById('downloadQR').addEventListener('click', function() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            if (qrCanvas) {
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = qrCanvas.toDataURL();
                link.click();
            }
        });

        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
